services:
  pi-test:
    build:
      context: ..
      dockerfile: docker/Dockerfile.pi-test
    container_name: barnaby-pi-test
    privileged: true
    cgroup: host
    tmpfs:
      - /tmp
      - /run
      - /run/lock
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    ports:
      - "2222:22"
